
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Github Glance</title>
    <link rel="stylesheet" href="/static/css/bootstrap.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>

<div class="card" data-bs-theme="dark" style="width: 32rem">
  <div class="d-flex align-items-center gap-3 px-3 py-2">
    <h3 class="card-title mb-0 fw-bold">Mohit Prajapat</h3>
    <span class="badge bg-primary text-light px-3 py-2 rounded-pill">
      Github's Stats
    </span>
  </div>
  <div class="card-body">
    <div class="rounded-4 row">
      <div class="col-md-7">
        <div class="d-flex flex-column gap-2">
          <div class="d-flex">
            <div class="row w-100">
              <div class="col-md-10 text-warning">
                <i class="far fa-star"></i>
                <span>Total Stars Earned</span>
              </div>
              <div class="col-md-2">99</div>
            </div>
          </div>
          <div class="d-flex">
            <div class="row w-100">
              <div class="col-md-10 text-warning">
                <i class="fa fa-code-commit"></i>
                <span>Total Commits 2025</span>
              </div>
              <div class="col-md-2">99</div>
            </div>
          </div>
          <div class="d-flex">
            <div class="row w-100">
              <div class="col-md-10 text-warning">
                <i class="fa fa-code-pull-request"></i>
                <span>Total PRs</span>
              </div>
              <div class="col-md-2">99</div>
            </div>
          </div>
          <div class="d-flex">
            <div class="row w-100">
              <div class="col-md-10 text-warning">
                <i class="fa fa-bug"></i>
                <span>Total Issues</span>
              </div>
              <div class="col-md-2">99</div>
            </div>
          </div>
          <div class="d-flex">
            <div class="row w-100">
              <div class="col-md-10 text-warning">
                <i class="fa fa-folder-tree"></i>
                <span>Total Repositories</span>
              </div>
              <div class="col-md-2">99</div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-5">
        <img
          src="/static/img/logo/github-cat.png"
          class="img-thumbnail rounded-circle mx-auto d-block border-5 border-warning w-75 shadow-sm img-fluid"
          alt="Logo"
        />
      </div>
    </div>
  </div>
</div>

  </body>
</html>
